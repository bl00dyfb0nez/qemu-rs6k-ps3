# Delete every workflow run that predates the current commit, so the run pages,
# logs and artifacts from earlier commits stop being reachable from the Actions
# UI as soon as a new commit lands.
#
# A run pins the commit it was started from.  Once that commit has been rewritten
# out of every branch, the run page is the last in-repository way to open it, and
# a force-push does not delete runs.  Pruning on every push closes that route.
#
# retain_days: 0 disables the age filter - the action only applies it when the
# value is greater than zero - and keep_minimum_runs: 1 then retains only the
# newest completed run of each workflow.  Runs that are not completed are never
# deletion candidates, so this job cannot delete itself; a workflow whose current
# run is still in flight keeps its previous run until the next push removes it.
#
# `actions: write` is required to delete runs.  A workflow started by `schedule`
# gets a read-only token unless the permission is declared here, and a repository
# level default cannot grant more than this file asks for.

name: Delete old workflow runs

on:
  push:
    branches: [master]
  schedule:
    # Daily, well away from the build workflow's peak so the two do not contend.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    name: Prune runs from earlier commits
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

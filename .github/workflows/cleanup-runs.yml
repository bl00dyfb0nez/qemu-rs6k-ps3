# Delete old workflow runs so their pages, their logs and the artifacts they
# carry stop being reachable from the Actions UI.
#
# A run pins the commit it was started from.  Once that commit has been rewritten
# out of every branch, the run page is the last in-repository way to open it, and
# a run is not deleted by a force-push.  Pruning runs on a schedule is the part of
# that cleanup a workflow can do for itself; objects GitHub keeps internally are
# still only removable through a support request.
#
# `actions: write` is required to delete runs.  A workflow started by `schedule`
# gets a read-only token unless the permission is declared here, and a repository
# level default cannot grant more than this file asks for.

name: Delete old workflow runs

on:
  schedule:
    # Daily, well away from the build workflow's peak so the two do not contend.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-runs:
    name: Prune runs older than 30 days
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 6
